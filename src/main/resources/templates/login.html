
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Asset Booking Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .login-container {
            background: white;
            width: 390px;
            max-width: 100%;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .switch {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .switch a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Asset Booking</h1>

    <!-- LOGIN FORM -->
    <div id="loginSection">

        <p class="subtitle">Login to your account</p>

        <div id="loginMessage" class="message"></div>

        <form action="/login" method="post">

            <label for="loginEmail">Email Address</label>
            <input type="email"
                   id="loginEmail"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label for="loginPassword">Password</label>
            <input type="password"
                   id="loginPassword"
                   name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p class="switch">
            Don't have an account?
            <a onclick="showRegister()">Create New Account</a>
        </p>

    </div>


    <!-- REGISTER FORM -->
    <div id="registerSection" class="hidden">

        <p class="subtitle">Create your new account</p>

        <div id="registerMessage" class="message"></div>

        <form action="/register" method="post">

            <label for="fullName">Full Name</label>
            <input type="text"
                   id="fullName"
                   name="fullName"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   required>

            <label for="registerEmail">Email Address</label>
            <input type="email"
                   id="registerEmail"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label for="registerPassword">Password</label>
            <input type="password"
                   id="registerPassword"
                   name="password"
                   placeholder="Create your password"
                   minlength="6"
                   autocomplete="new-password"
                   required>

            <button type="submit">Register</button>

        </form>

        <p class="switch">
            Already have an account?
            <a onclick="showLogin()">Login Here</a>
        </p>

    </div>

    <p class="footer">Asset Booking Portal</p>

</div>

<script>

    function showRegister() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("registerSection").classList.remove("hidden");
    }

    function showLogin() {
        document.getElementById("registerSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
    }

    const params = new URLSearchParams(window.location.search);

    if (params.get("registered") === "true") {
        document.getElementById("loginMessage").textContent =
            "Registration successful! Please login.";
        document.getElementById("loginMessage").classList.add("success");
    }

    if (params.get("error") === "invalid") {
        document.getElementById("loginMessage").textContent =
            "Invalid email or password. Please try again.";
        document.getElementById("loginMessage").classList.add("error");
    }

    if (params.get("error") === "emailExists") {
        showRegister();
        document.getElementById("registerMessage").textContent =
            "This email is already registered.";
        document.getElementById("registerMessage").classList.add("error");
    }

    if (params.get("error") === "empty") {
        showRegister();
        document.getElementById("registerMessage").textContent =
            "Please fill in all fields.";
        document.getElementById("registerMessage").classList.add("error");
    }

</script>

</body>
</html>
